name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: backend (unit + integration)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # sounddevice loads libportaudio at import time, and server.py imports it
      - name: PortAudio runtime
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libportaudio2

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: pashyanti/backend/uv.lock

      - name: Install dependencies
        working-directory: pashyanti/backend
        run: uv sync --frozen

      # The unit tests need no key. The integration test stubs the microphone and
      # TTS, so a placeholder is enough — no credits are spent in CI, ever.
      - name: Unit + integration tests
        working-directory: pashyanti/backend
        env:
          GNANI_API_KEY: test-key-not-used-in-ci
        run: uv run python -m unittest discover -s tests -t . -v

  web:
    name: web (type-check + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        working-directory: pashyanti/web
        run: bun install --frozen-lockfile

      # `build` is `tsc --noEmit && vite build`, so this is the type gate too
      - name: Type-check and build
        working-directory: pashyanti/web
        run: bun run build
